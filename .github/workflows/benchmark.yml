name: Offline benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build release executable
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release --parallel
      - name: Replay 200k packets with one worker
        run: python3 tests/offline_load.py ./build-release/netscope --packets 200000 --workers 1 --queue-size 8192
      - name: Replay 200k packets with four workers
        run: python3 tests/offline_load.py ./build-release/netscope --packets 200000 --workers 4 --queue-size 8192
      - name: Replay 200k packets with a larger queue
        run: python3 tests/offline_load.py ./build-release/netscope --packets 200000 --workers 4 --queue-size 32768
